name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - name: Every detection parses and passes its own examples
        run: python scripts/check_detections.py
      - run: python -m pytest -q
      - name: The evaluation reproduces the committed report
        run: |
          python scripts/evaluate.py > /dev/null
          git diff --exit-code reports/dev.json
      - name: Quality gate (backtest budgets, before-impact, claims relied on)
        run: python scripts/gate.py
      - name: README and console data match the reports
        run: |
          python scripts/readme.py
          git diff --exit-code README.md web/public/data/console.json
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm test
