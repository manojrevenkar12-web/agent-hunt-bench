[project]
name = "agent-hunt-bench"
version = "0.1.0"
description = "Detection as code, a context graph and checked LLM triage, scored against attacks whose truth is known"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyyaml>=6"]

[project.optional-dependencies]
live = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E741", "E731"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
